<!DOCTYPE html>
<html>
<head>
    <title>JS Event Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>JavaScript Event Handling Lab</h1>

    <section style="padding: 20px; border: 1px solid black; margin-top: 10px;">
        <h2>4. Focus and Blur</h2>
        <input type="text" id="focus-input" placeholder="Click in and out of here">
        <p id="focus-msg"></p>
    </section>

    <section style="padding: 20px; border: 1px solid black; margin-top: 10px;">
        <h2>5. Event Delegation</h2>
        <div id="btn-container">
            <button>Button A</button>
            <button>Button B</button>
            <button>Button C</button>
        </div>
        <p id="delegation-msg"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
